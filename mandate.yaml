# =============================================================================
# mandate.yaml
# The user's investment mandate. Division of labor:
#   - the USER sets bucket weights (how much capital goes where) -> hard bounds
#   - the AGENTS distribute inside each bucket (which instruments, how much) and
#     fill any space the user leaves open
#   - instrument SELECTION is always the agents' job
#
# All weights are fractions of the TOTAL portfolio (0.50 = 50% of everything).
# A user-locked weight is a hard constraint; its `band` is how far agents may
# let it drift before a rebalance pulls it back. Space a user doesn't lock is
# "open" and distributed by the agents, subject to the sub-limits below.
# =============================================================================

total: 1.0

default_limits:
  min_names: 1

buckets:
  # What the app actually runs: a portfolio is 100% equities across the sectors
  # chosen at launch, with no forced cash. Cash only comes from the rulebook's
  # limits below and from whole-share rounding. (Per-stock caps scale with the
  # number of stocks: web_ui._max_per_name_for.)
  equities:
    set_by: user
    weight: 1.0

# =============================================================================
# rulebook: THE rules for long-term portfolios (rulebook.py explains each one).
# The live recommendation, the news watch, the reviewer and the backtest all read
# this one block. Every rule applies to every stock; price limits are measured in
# each stock's own volatility. Change these only with evidence from
# rulebook_backtest.py across several periods, never to fit one incident.
# =============================================================================
rulebook:
  # score: weights of the within-sector percentiles
  weight_momentum: 0.35           # 12 months ago to 1 month ago
  weight_quality: 0.25            # margins, returns on equity, leverage, growth
  weight_value: 0.20              # forward earnings yield
  weight_llm: 0.20                # the model's read, ranked among the peers it compared
  pullback_weight: 0.10           # a pullback in an intact uptrend, with clean news
  # who may be held at all
  min_history_bars: 252           # about a year of trading days
  min_dollar_volume: 10000000
  # keeping a stock: stays while ranked inside this multiple of the portfolio's size
  keep_rank_multiple: 2.0
  # selling a loser: below cost AND behind its sector, since purchase, by this many monthly sigmas
  stop_sigma_mult: 3.0            # catches severe breakdowns only: tighter stops didn't reduce drawdowns in the backtest
  # a sector moving this many of its own daily sigmas lets the news watch consider re-ranking early
  sector_move_sigmas: 2.0
  # dip buying: the pullback must score this well, and the company rank this high on quality in its sector
  dip_min_credit: 0.5
  dip_min_quality_pct: 0.5
  dip_replace_margin: 0.20        # how much better a dip must score to replace a holding (1 = never replace); 0 took turnover to over 10x a year
  # no rebuy for this long after any sale, whatever the reason
  reentry_block_days: 30
  # no new buy this close to a company's earnings report
  earnings_block_days: 3
  # portfolio limits; any excess stays cash
  max_industry_weight: 0.35
  max_portfolio_beta: 1.5
  # trading
  min_trade_pct: 0.005            # a change under 0.5% of the portfolio doesn't trade
  cost_bps: 10                    # per side, charged in backtests and on the scorecard

# =============================================================================
# day_trading — the intraday capability (long-only, US equities).
# NOT part of `buckets` above: buckets are fractions of the total portfolio and
# feed mandate_allocator.py, which never reads this block. The day-trading
# sleeve is a fixed dollar amount in its OWN Alpaca paper account (separate API
# keys — see daytrade_broker.py), so intraday churn can't pollute portfolio
# positions or trigger wash-trade rejections against portfolio orders.
# Every value below is a STARTING DEFAULT. Typos here are errors, not no-ops
# (daytrade_config.py rejects unknown keys).
# =============================================================================
day_trading:
  enabled: true
  sleeve_capital: 25000          # dollars; sizing is cash-based, never margin buying power
  long_only: true                # shorting is not implemented — false is rejected
  run_unfiltered_shadow: true    # also simulate the no-LLM-playbook engine each day (ablation data)

  universe:
    min_price: 5.0
    min_avg_volume: 1000000
    max_watchlist: 30

  limits:
    max_positions: 5
    risk_per_trade: 0.01         # 1% of sleeve risked (entry -> stop) per trade
    max_position_pct: 0.20       # <= 20% of sleeve in one name
    daily_loss_halt: 0.03        # -3% of sleeve on the day -> stop trading, flatten
    max_trades_per_day: 20
    min_stop_pct: 0.002
    flatten_on_halt: true

  session:                       # Eastern time
    no_entry_first_minutes: 5
    last_entry_et: "15:30"
    flatten_et: "15:45"

  costs:                         # applied to every backtest number (see daytrade_config.CostModel)
    slippage_bps: 3.0
    participation_cap: 0.10

  strategies: [orb_long, vwap_pullback_long, gap_and_go_long]
  params: {}                     # e.g. orb_long: { or_minutes: 15, rr: 2.0 }

  # Failure-learning loop (daytrade_learning.py). Learned "lessons" can only
  # SKIP a setup or SHRINK its size — never add trades, raise size, or touch the
  # limits above — and each must pass an out-of-sample test before it can be used.
  learning:
    enabled: true
    auto_activate: false         # validated lessons wait for a human (dashboard or CLI)
    min_matched_trades: 30       # historical setups a rule must match to be judged at all
    min_distinct_days: 10        # ...spread over at least this many days
    max_p_value: 0.05            # before the multiple-testing correction, which only raises the bar
    min_walkforward_win_rate: 0.5
    max_opportunity_cost: 0.25   # a rule may discard at most 25% of all winning R
    max_active_lessons: 10
    min_combined_risk_mult: 0.25 # stacked size cuts never go below 25% of normal risk
    lesson_ttl_days: 60          # active lessons with no live evidence by then expire
    max_proposals_per_day: 3
    post_exit_minutes: 30        # watch price after an exit (was the stop just noise?)

# =============================================================================
# proactive_recalibration: the mid-day news watch (proactive_recal.py). Once per
# trading day it checks each open portfolio whose owner switched it on. It can
# SELL an affected stock and fill that slot (the rulebook's stop, or thesis-breaking
# news), or re-rank the whole portfolio when a sector it holds moves unusually and
# the model judges the move a real change in that sector's outlook, or buy a
# valuable stock on a real dip, however recently the portfolio recalibrated.
# =============================================================================
proactive_recalibration:
  enabled: true
  dry_run: false                  # true = assess and log only, never trade
  max_proactive_per_30d: 2        # early trades allowed, news or sector; only the rulebook's stop may go beyond this
  min_confidence: 0.7             # the model must be at least this sure before news sells a stock
  news_lookback_days: 1
  material_weight: 0.05           # holdings under 5% don't raise unusual-move flags on their own
  big_move_sigmas: 3.0            # flag a move this many daily sigmas (evidence for the model, not a trade)
  big_move_pct: 0.06              # the same flag for a stock with no volatility data
  dip_buys: true                  # buy a valuable stock on a real dip any day; the 30-day limit doesn't apply

# =============================================================================
# evaluation: the evaluation agent (rec_evaluator.py). Reviews every
# recalibration's orders BEFORE they are placed, on every trigger. Hard checks
# and the AI review can block a BUY; a SELL is never blocked. Also powers the
# Evaluation page (track record of past calls vs. their sector).
# =============================================================================
evaluation:
  enabled: true
  max_single_weight: 0.30    # block a BUY that would put > 30% (or > an equal share) in one stock ...
  min_names_for_cap: 3       # ... when the portfolio targets 3+ names
  red_flag_days: 2           # block a BUY with fraud / SEC probe / bankruptcy / halt headlines this recent
  ai_review: true            # Gemini review (grade A-F + per-order verdicts)
  ai_veto: true              # its "object" (and "concern" on an F plan) blocks the BUY
  track_record_min_trades: 30  # the reviewer sees a track-record line only with this many graded trades
